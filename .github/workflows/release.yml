name: Release
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: platega-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve add-on version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          meta = json.loads(Path('upload/src/addons/Evrik/Platega/addon.json').read_text())
          match = re.fullmatch(r'(\d+\.\d+\.\d+)(?: Beta (\d+))?', meta['version_string'])
          if not match:
              raise SystemExit('Unsupported version_string for release workflow')
          beta = match.group(2)
          tag = f'v{match.group(1)}' + (f'-beta.{beta}' if beta else '')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as target:
              target.write(f'tag={tag}\nprerelease={str(bool(beta)).lower()}\n')
          print(f'Resolved release tag: {tag}')
          PY

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.existing.outputs.exists != 'true'
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate source
        if: steps.existing.outputs.exists != 'true'
        run: |
          find upload tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/protocol.php
          python3 scripts/check-package.py

      - name: Build and validate release archive
        if: steps.existing.outputs.exists != 'true'
        run: |
          python3 scripts/build.py
          python3 scripts/check-archive.py
          first="$(sha256sum dist/Evrik-Platega-*.zip | cut -d' ' -f1)"
          python3 scripts/build.py
          second="$(sha256sum dist/Evrik-Platega-*.zip | cut -d' ' -f1)"
          test "$first" = "$second"
          python3 scripts/check-archive.py

      - name: Publish GitHub release and tag
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* "${flags[@]}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$RELEASE_TAG"
