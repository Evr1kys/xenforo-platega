name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          meta = json.loads(Path('upload/src/addons/Evrik/Platega/addon.json').read_text())
          match = re.fullmatch(r'(\d+\.\d+\.\d+) Beta (\d+)', meta['version_string'])
          if not match:
              raise SystemExit('Unsupported version_string for release workflow')
          expected = f'v{match.group(1)}-beta.{match.group(2)}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must be {expected}, got {os.environ["RELEASE_TAG"]}')
          print(f'Release tag matches add-on version: {expected}')
          PY
      - name: Validate source
        run: |
          find upload tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/protocol.php
          python3 scripts/check-package.py
      - name: Build release archive
        run: |
          python3 scripts/build.py
          python3 scripts/check-archive.py
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
